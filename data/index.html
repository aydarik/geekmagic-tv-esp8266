<!DOCTYPE html>
<html lang="en">
<head>
    <title>SmartClock Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --primary-color: #4dabf7;
            --primary-hover-color: #339af0;
            --danger-color: #ff6b6b;
            --danger-hover-color: #fa5252;
            --background-color: #0f1115;
            --card-bg-color: #1a1d23;
            --border-color: #2a2f38;
            --text-color: #e9ecef;
            --light-text-color: #9aa0a6;
            --shadow-color: rgba(0, 0, 0, 0.6);
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            font-family: var(--font-family);
            margin: 0;
            padding: 20px;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.5
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: var(--card-bg-color);
            border-radius: 8px;
            box-shadow: 0 4px 12px var(--shadow-color);
            overflow: hidden
        }

        h1 {
            background-color: #111318;
            color: var(--text-color);
            padding: 15px 20px;
            margin: 0;
            font-size: 1.8em;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        a {
            color: var(--text-color);
            text-decoration: none;
        }

        a:hover {
            color: var(--light-text-color);

        }

        .card {
            background-color: var(--card-bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin: 20px;
            overflow: hidden;
            box-shadow: 0 2px 5px var(--shadow-color)
        }

        .card-header {
            background-color: #20242c;
            padding: 10px 15px;
            font-size: 1.2em;
            font-weight: bold;
            color: var(--primary-color);
            border-bottom: 1px solid var(--border-color)
        }

        .card-body {
            padding: 15px
        }

        .input-group {
            margin-bottom: 15px
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--text-color)
        }

        .input-group input[type="number"], .input-group input[type="text"], .input-group input[type="password"], .input-group input[type="range"], .input-group select, .input-group textarea {
            width: calc(100% - 22px);
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            background-color: #111318;
            color: var(--text-color);
            font-size: 1em;
            margin-top: 3px
        }

        .input-group input[type="file"] {
            margin-top: 5px
        }

        .button {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-size: 1em;
            margin-top: 10px;
            transition: background-color 0.2s ease
        }

        .button:hover {
            background-color: var(--primary-hover-color);
        }

        .button.red {
            background-color: var(--danger-color)
        }

        .button.red:hover {
            background-color: var(--danger-hover-color)
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px
        }

        .button-group .button {
            margin-top: 0
        }

        .info {
            background-color: #0b3d45;
            color: #9be7ff;
            border: 1px solid #155e63;
            padding: 10px;
            border-radius: 5px;
            margin-top: 15px;
            font-size: 0.9em
        }

        .version-info {
            background-color: #15181e;
            color: var(--light-text-color);
            padding: 8px 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 0.9em;
            text-align: center
        }

        #scanStatus {
            margin-top: 10px;
            font-style: italic;
            color: var(--light-text-color)
        }

        form {
            margin-bottom: 0
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #155e63;
            padding: 8px 12px;
        }

        th {
            background: #0c3235;
            text-align: left;
        }

        .size {
            text-align: right;
            font-family: monospace;
        }

        .spacer {
            height: 10px
        }
    </style>
</head>
<body>
<div class="container"><h1>SmartClock Control</h1>
    <div class="card">
        <div class="card-header">Status & Info</div>
        <div class="card-body">
            <div class="version-info">Firmware Version: <strong id="firmwareVersion">Loading...</strong></div>
            <div class="button-group">
                <a href="/app.json" class="button">App JSON</a>
                <a href="/space.json" class="button">Storage Info</a>
                <a href="/brt.json" class="button">Brightness JSON</a>
                <a href="/log" class="button">View Logs</a>
            </div>
        </div>
    </div>
    <div class="card">
        <div class="card-header">WiFi Configuration</div>
        <div class="card-body">
            <button class="button" onclick="scanWiFi()">Scan Networks</button>
            <div id="scanStatus"></div>
            <div id="wifiSection" style="display: none; margin-top: 15px;">
                <div class="input-group">
                    <label for="wifiNetwork">Select Network:</label>
                    <select id="wifiNetwork"></select>
                </div>
                <div class="input-group">
                    <label for="wifiPassword">Password:</label>
                    <input type="password" id="wifiPassword" placeholder="Enter WiFi password"/>
                </div>
                <button class="button" onclick="connectWiFi()">Connect</button>
            </div>
        </div>
    </div>
    <div class="card">
        <div class="card-header">Themes</div>
        <div class="card-body">
            <div class="version-info">Current theme: <strong id="currentTheme">Loading...</strong></div>
            <div class="button-group">
                <button class="button" onclick="setTheme(1)">1. Clock</button>
                <button class="button" onclick="setTheme(2)">2. Message</button>
                <button class="button" onclick="setTheme(3)">3. Image</button>
            </div>
        </div>
    </div>
    <div class="card">
        <div class="card-header">Settings</div>
        <div class="card-body">
            <div class="input-group">
                <label for="showIP">IP address on Clock screen:</label>
                <input type="checkbox" id="showIP" onchange="setShowIP()">
                Show IP address
            </div>
            <div class="input-group">
                <label for="brightness">Brightness: <span id="brightnessValue">0</span>%</label>
                <input type="range" id="brightness" min="0" max="100" value="0" onchange="setBrightness()"
                       oninput="document.getElementById('brightnessValue').innerText = this.value">
            </div>
            <div class="input-group">
                <label for="tz">Timezone:</label>
                <input type="text" id="tz">
                <button class="button" onclick="setTimezone()">Set Timezone</button>
            </div>
        </div>
    </div>
    <div class="card">
        <div class="card-header">Custom Message</div>
        <div class="card-body">
            <div class="input-group">
                <label for="customMessage">Message:</label>
                <textarea id="customMessage" rows="5" cols="33"></textarea>
            </div>
            <button class="button" onclick="sendCustomMessage()">Send</button>
        </div>
    </div>
    <div class="card">
        <div class="card-header">Image Management</div>
        <div class="card-body">
            <form action="/doUpload?dir=/image/" method="POST" enctype="multipart/form-data">
                <div class="input-group">
                    <label for="fileUpload">Upload JPEG Image:</label>
                    <input type="file" name="file" accept="image/jpeg" id="fileUpload"/>
                    <input type="submit" value="Upload" class="button"/>
                </div>
            </form>
            <div class="info">
                <div id="imageList">Loading...</div>
                <div class="spacer"></div>
                <span id="filesTable"></span>
            </div>
            <div class="input-group">
                <button class="button" onclick="displayTestImage()">Display Test Image</button>
            </div>
        </div>
    </div>
    <div class="card">
        <div class="card-header">Advanced Actions</div>
        <div class="card-body button-group"><a href="/update" class="button">Firmware Update (OTA)</a>
            <button class="button red" onclick="factoryReset()">Factory Reset</button>
        </div>
    </div>
</div>

<script>
    function setBrightness() {
        var brightness = document.getElementById("brightness").value;
        fetch('/set?brt=' + brightness).catch(error => console.error('Error:', error));
    }

    function setShowIP() {
        var val = document.getElementById("showIP").checked;
        fetch('/set?ip=' + val).catch(error => console.error('Error:', error));
    }

    function setTimezone() {
        var tz = document.getElementById("tz").value;
        fetch('/set?tz=' + tz).then(response => response.text()).then(data => alert('Timezone set: ' + data)).catch(error => console.error('Error:', error));
    }

    function displayImage(imagePath) {
        fetch('/set?img=' + imagePath).catch(error => console.error('Error:', error));
    }

    function deleteImage(imagePath) {
        fetch('/delete?file=' + imagePath).then(_ => loadData()).catch(error => console.error('Error:', error));
    }

    function setTheme(id) {
        fetch('/set?theme=' + id).then(_ => document.getElementById('currentTheme').textContent = id).catch(error => console.error('Error:', error));
    }

    function sendCustomMessage() {
        const customMessage = document.getElementById('customMessage').value.replaceAll("\n", "%0A");
        fetch('/set?msg=' + customMessage).catch(error => console.error('Error:', error));
    }

    function displayTestImage() {
        fetch('/test').catch(error => console.error('Error:', error));
    }

    function factoryReset() {
        if (confirm("WARNING: Are you sure you want to perform a factory reset? This will erase all settings and files and restart the device.")) {
            fetch('/factoryreset').then(response => response.text()).then(data => alert(data)).catch(error => console.error('Error:', error));
        }
    }

    function scanWiFi() {
        document.getElementById('scanStatus').textContent = 'Scanning for networks...';
        document.getElementById('wifiSection').style.display = 'none';
        fetch('/scan').then(response => response.json()).then(data => {
            if (data.length === 0) {
                document.getElementById('scanStatus').textContent = 'No networks found';
                return;
            }
            const select = document.getElementById('wifiNetwork');
            select.innerHTML = '<option value="">--Select a network--</option>';
            data.forEach(network => {
                if (network.ssid && network.ssid.trim() !== '') {
                    const option = document.createElement('option');
                    option.value = network.ssid;
                    option.textContent = network.ssid;
                    select.appendChild(option);
                }
            });
            document.getElementById('scanStatus').textContent = `Found ${data.length} network(s)`;
            document.getElementById('wifiSection').style.display = 'block';
        }).catch(error => {
            console.error('Error:', error);
            document.getElementById('scanStatus').textContent = 'Scan failed';
        });
    }

    function connectWiFi() {
        const ssid = document.getElementById('wifiNetwork').value;
        const password = document.getElementById('wifiPassword').value;
        if (!ssid) {
            alert('Please select a network');
            return;
        }
        if (confirm(`Connect to ${ssid}?`)) {
            document.getElementById('scanStatus').textContent = 'Connecting...';
            fetch(`/connect?ssid=${encodeURIComponent(ssid)}&password=${encodeURIComponent(password)}`).then(response => response.text()).then(data => {
                alert(data);
                document.getElementById('scanStatus').textContent = 'Connection attempt sent. Please wait for device to restart...';
            }).catch(error => {
                console.error('Error:', error);
                document.getElementById('scanStatus').textContent = 'Connection failed';
            });
        }
    }

    function formatSize(bytes) {
        if (bytes < 1024) return bytes + " B";
        return (bytes / 1024).toFixed(1) + " KB";
    }

    function loadData() {
        fetch('/app.json').then(response => response.json()).then(data => {
            document.getElementById('currentTheme').textContent = data.theme;
            document.getElementById('tz').value = data.tz;
            document.getElementById('showIP').checked = data.showIP !== false;
        }).catch(error => {
            console.error('Error fetching app data:', error)
            document.getElementById('currentTheme').textContent = 'Unknown';
        });

        fetch('/brt.json').then(response => response.json()).then(data => {
            document.getElementById('brightnessValue').innerText = data.brt;
            document.getElementById('brightness').value = data.brt;
        }).catch(error => {
            console.error('Error fetching brightness:', error);
        });

        fetch('/version.json').then(response => response.json()).then(data => {
            document.getElementById('firmwareVersion').textContent = data.version;
        }).catch(error => {
            console.error('Error fetching version:', error);
            document.getElementById('firmwareVersion').textContent = 'Unknown';
        });

        fetch('/space.json').then(response => response.json()).then(data => {
            document.getElementById("imageList").textContent = `Free space: ${formatSize(data.free)}`;
        }).catch(error => {
            console.error('Error fetching space:', error);
            document.getElementById('imageList').textContent = 'Unknown';
        });

        fetch('/message.json').then(response => response.json()).then(data => {
            document.getElementById("customMessage").value = data.msg;
        }).catch(error => {
            console.error('Error fetching custom message:', error);
            document.getElementById("customMessage").value = '';
        });

        fetch('/filelist').then(response => response.text()).then(data => {
            document.getElementById('filesTable').innerHTML = data;
        }).catch(error => {
            console.error('Error fetching files:', error);
            document.getElementById('filesTable').textContent = 'Unable to fetch image list :(';
        });
    }

    window.onload = function () {
        loadData()
    };
</script>
</body>
</html>
